<style>
  :root{--bg:#000;--card:#161a22;--line:#2a3140;--txt:#e8ecf4;--dim:#8d96a8;--acc:#4f8cff}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--txt);
    font:16px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;background:radial-gradient(900px 700px at 50% 50%,#161d2b,#07090d)}
  #c,#v{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;background:transparent;display:none}
  #touch{position:absolute;inset:0;touch-action:none}
  #hud{position:fixed;left:12px;top:8px;font-size:12px;color:#fff;opacity:.7;pointer-events:none;text-shadow:0 1px 2px #000}
  #gear{position:fixed;right:10px;top:10px;width:44px;height:44px;border-radius:22px;border:0;background:#000a;color:#fff;
    font-size:22px;opacity:.35;z-index:4}
  #gear:active{opacity:1}
  #panel{position:fixed;right:10px;top:62px;width:min(420px,92vw);max-height:88vh;overflow:auto;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:14px 16px 8px;z-index:6;display:none;box-shadow:0 12px 40px #000c}
  #panel h3{margin:0 0 10px;font-size:15px;font-weight:600}
  .row{margin:0 0 12px}.row label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:64px;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:#10131a;color:var(--txt);font-size:14px}
  .seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% 30%,#12203a,#000);gap:16px;z-index:8}
  #start h1{margin:0;font-size:28px;font-weight:650;letter-spacing:.3px}
  #start button{font-size:20px;padding:15px 38px;border-radius:16px;border:0;background:var(--acc);color:#fff;font-weight:600}
  #start small{color:var(--dim);max-width:80%;text-align:center;line-height:1.4}
  .hide{display:none!important}
  #dockbtn{position:fixed;right:62px;top:10px;width:44px;height:44px;border-radius:22px;border:0;background:#000a;color:#fff;
    font-size:20px;opacity:.35;z-index:4}
  #dockbtn:active{opacity:1}
  #dock{position:fixed;left:50%;top:10px;transform:translateX(-50%);display:none;gap:8px;padding:8px;z-index:6;
    background:#161a22f2;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px #000c;max-width:96vw;flex-wrap:wrap;justify-content:center}
  #dock button{width:64px;height:64px;border-radius:16px;border:1px solid var(--line);background:#10131a;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:24px;line-height:1;padding:0}
  #dock button small{font-size:10px;color:var(--dim)}
  #dock button:active{background:var(--acc);border-color:var(--acc)}
  #dock button.on{background:#27324a;border-color:var(--acc)}
  #dock .sep{width:1px;background:var(--line);margin:4px 2px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#161a22ee;border:1px solid var(--line);border-radius:14px;
    padding:10px 16px;font-size:14px;z-index:7;display:none;max-width:90vw;text-align:center}
  #pin{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(1200px 600px at 50% 30%,#12203a,#000);z-index:9}
  #pin h1{margin:0;font-size:26px;font-weight:650}
  #pin input{font-size:30px;letter-spacing:10px;text-align:center;width:min(300px,70vw);padding:12px;border-radius:14px;
    border:1px solid var(--line);background:#10131a;color:#fff;-webkit-user-select:text;user-select:text}
  #pin button{font-size:19px;padding:13px 34px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-weight:600}
  #pin small{color:var(--dim)} #pin .err{color:#ff7a7a;min-height:1.2em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <video id="v" muted playsinline autoplay></video>
  <div id="touch"></div>
</div>
<div id="hud">…</div>
<button id="gear" aria-label="Настройки">⚙</button>
<button id="dockbtn" aria-label="Быстрые кнопки">☰</button>
<div id="dock"></div>
<div id="toast"></div>
<div id="panel"></div>
<div id="pin">
  <h1>Введите PIN</h1>
  <input id="pininput" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
  <div class="err" id="pinerr"></div>
  <button id="pinok">Войти</button>
  <small>PIN показан в приложении Rudich Auto на телефоне</small>
</div>
<div id="start">
  <h1>Rudich Auto</h1>
  <button id="go">Запустить</button>
  <small id="msg">Нажмите, чтобы включить полноэкранный режим и звук</small>
</div>
<script>
(() => {
  'use strict';
  const KIND = {CONFIG: 0, KEY: 1, DELTA: 2, AUDIO: 3};
  const $ = id => document.getElementById(id);
  const canvas = $('c'), video = $('v'), ctx = canvas.getContext('2d'), touchEl = $('touch');
  const hud = $('hud'), startEl = $('start'), msg = $('msg'), panel = $('panel');
  const params = new URLSearchParams(location.search);
  // Hosted on the Internet (GitHub Pages) the page talks to the phone at its claimed address; served by the phone it uses its own host.
  const REMOTE = location.hostname === 'app.rudichauto.space';
  const PHONE = REMOTE ? 'auto.rudichauto.space:8443' : location.host;
  const HTTP = REMOTE ? 'https://' + PHONE : '';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // fetch that gives up: an unreachable phone (address claimed by a VPN that is not up yet) otherwise hangs for minutes
  const tfetch = (url, ms = 3000) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(url, {cache: 'no-store', signal: c.signal}).finally(() => clearTimeout(t)); };
  let token = params.get('k') || '';
  try { token = token || localStorage.getItem('aa_pin') || ''; } catch (e) {}

  let ws = null, cfg = {fit: 'fill', w: 1280, h: 720, uw: 1280, uh: 720, fps: 30, dpi: 213, audio: false, res: 'R720', fitName: 'AUTO', orient: 'L'};
  let stats = {kbps: 0, fps: 0, q: 0};
  let srcW = 1280, srcH = 720;
  let audioCtx = null, audioCursor = 0;
  let drops = 0, rtt = null, lastMsgAt = performance.now(), toastTimer = 0;

  // ---------------------------------------------------------------- helpers
  const concat = (a, b) => { const r = new Uint8Array(a.length + b.length); r.set(a, 0); r.set(b, a.length); return r; };
  function nals(buf) { // Annex-B -> [{type, start, end}] (payload without start code)
    const out = []; let i = 0, prev = -1;
    const n = buf.length;
    while (i + 3 <= n) {
      if (buf[i] === 0 && buf[i + 1] === 0 && (buf[i + 2] === 1 || (i + 4 <= n && buf[i + 2] === 0 && buf[i + 3] === 1))) {
        const sc = buf[i + 2] === 1 ? 3 : 4;
        if (prev >= 0) out[out.length - 1].end = i;
        prev = i + sc;
        out.push({type: buf[prev] & 0x1f, start: prev, end: n});
        i += sc;
      } else i++;
    }
    return out;
  }
  const same = (a, b) => !!a && !!b && a.length === b.length && a.every((v, i) => v === b[i]);
  const hex2 = b => b.toString(16).padStart(2, '0');
  function codecOf(cfgBytes) {
    const s = nals(cfgBytes).find(x => x.type === 7);
    return s ? 'avc1.' + hex2(cfgBytes[s.start + 1]) + hex2(cfgBytes[s.start + 2]) + hex2(cfgBytes[s.start + 3]) : 'avc1.42E01F';
  }

  // ---------------------------------------------------------------- video back-ends
  let backend = null;   // {name, config(bytes), frame(kind, ts, bytes), reset()}
  let spsPps = null;

  // --- A) WebCodecs
  function makeWebCodecs() {
    let dec = null, gotKey = false, last = null;
    const b = {
      name: 'WebCodecs',
      config(bytes) {
        if (dec && same(last, bytes)) return;
        last = bytes;
        if (dec) { try { dec.close(); } catch (e) {} }
        gotKey = false;
        dec = new VideoDecoder({
          output: f => {
            if (canvas.width !== f.displayWidth || canvas.height !== f.displayHeight) {
              canvas.width = f.displayWidth; canvas.height = f.displayHeight; srcW = f.displayWidth; srcH = f.displayHeight;
            }
            ctx.drawImage(f, 0, 0); f.close(); counted++;
          },
          error: e => { console.warn('decoder error', e); send('R'); setTimeout(() => last && b.config(last), 200); },
        });
        dec.configure({codec: codecOf(bytes), optimizeForLatency: true, avc: {format: 'annexb'}});
      },
      frame(kind, ts, data) {
        if (!dec) return;
        const key = kind === KIND.KEY;
        if (!key && !gotKey) { askKeyframe(); return; }
        // the decoder can't keep up: drop the backlog and resume from the next keyframe instead of showing old pictures
        if (!key && dec.decodeQueueSize > 6) { gotKey = false; drops++; askKeyframe(); return; }
        let d = data;
        if (key) { gotKey = true; if (!nals(data).some(x => x.type === 7) && last) d = concat(last, data); }
        try { dec.decode(new EncodedVideoChunk({type: key ? 'key' : 'delta', timestamp: Number(ts), data: d})); }
        catch (e) { console.warn('decode failed', e); }

      show() { canvas.style.display = 'block'; video.style.display = 'none'; },

  }

  // --- B) MSE with a tiny fMP4 muxer (for browsers without WebCodecs)
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  const u16 = n => [(n >>> 8) & 255, n & 255];

    out.set(u32(len), 0);
    for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);

    return out;

  const MATRIX = [...u32(0x10000), ...zeros(12), ...u32(0x10000), ...zeros(12), ...u32(0x40000000)];

  function initSegment(sps, pps, w, h) {
    const avcC = box('avcC', [1, sps[1], sps[2], sps[3], 0xFF, 0xE1, ...u16(sps.length), ...sps, 1, ...u16(pps.length), ...pps]);

    const stbl = box('stbl', stsd, box('stts', zeros(4), u32(0)), box('stsc', zeros(4), u32(0)),
      box('stsz', zeros(4), u32(0), u32(0)), box('stco', zeros(4), u32(0)));
    const dinf = box('dinf', box('dref', zeros(4), u32(1), box('url ', [0, 0, 0, 1])));
    const minf = box('minf', box('vmhd', [0, 0, 0, 1], zeros(8)), dinf, stbl);
    const mdia = box('mdia', box('mdhd', zeros(4), u32(0), u32(0), u32(90000), u32(0), u16(0x55c4), u16(0)),
      box('hdlr', zeros(4), u32(0), [...'vide'].map(c => c.charCodeAt(0)), zeros(12), [...'VideoHandler\0'].map(c => c.charCodeAt(0))), minf);
    const trak = box('trak', box('tkhd', [0, 0, 0, 7], u32(0), u32(0), u32(1), u32(0), u32(0), zeros(8), u16(0), u16(0), u16(0), u16(0),
      MATRIX, u32(w << 16), u32(h << 16)), mdia);
    const mvhd = box('mvhd', zeros(4), u32(0), u32(0), u32(90000), u32(0), u32(0x10000), u16(0x100), zeros(10), MATRIX, zeros(24), u32(2));
    const mvex = box('mvex', box('trex', zeros(4), u32(1), u32(1), u32(0), u32(0), u32(0)));
    const ftyp = box('ftyp', [...'isom'].map(c => c.charCodeAt(0)), u32(512), [...'isomiso2avc1mp41'].map(c => c.charCodeAt(0)));

  function toAvcc(annexB) {
    const list = nals(annexB).filter(n => n.type !== 9);       // drop access-unit delimiters
    let total = 0; list.forEach(n => total += 4 + (n.end - n.start));

    list.forEach(n => { const len = n.end - n.start; out.set(u32(len), o); out.set(annexB.subarray(n.start, n.end), o + 4); o += 4 + len; });
    return out;
  }

  function makeMse() {
    let ms = null, sb = null, queue = [], seq = 1, dts = 0, ready = false, gotKey = false, last = null, dur = 3000, pre = null;
    const b = {
      name: 'MSE',
      config(bytes) {
        if (ms && same(last, bytes)) return;
        last = bytes;
        const all = nals(bytes);
        const s = all.find(x => x.type === 7), p = all.find(x => x.type === 8);
        if (!s || !p) return;
        const sps = bytes.subarray(s.start, s.end), pps = bytes.subarray(p.start, p.end);
        const codec = codecOf(bytes);
        const mime = `video/mp4; codecs="${codec}"`;
        console.log('MSE config', mime, 'sps', sps.length, 'pps', pps.length, 'first sps bytes', [...sps.slice(0, 8)].join(','));
        if (!window.MediaSource || !MediaSource.isTypeSupported(mime)) { msg.textContent = 'Браузер не поддерживает ни WebCodecs, ни MSE/H.264'; return; }
        ready = false; gotKey = false; queue = []; pre = null; seq = 1; dts = 0; dur = Math.round(90000 / (cfg.fps || 30));
        if (ms) { try { URL.revokeObjectURL(video.src); } catch (e) {} }
        ms = new MediaSource();
        video.src = URL.createObjectURL(ms);
        ms.addEventListener('sourceopen', () => {
          sb = ms.addSourceBuffer(mime);
          sb.mode = 'sequence';
          sb.addEventListener('updateend', pump);
          sb.addEventListener('error', () => console.warn('sourcebuffer error', video.error && video.error.message));
          sb.appendBuffer(initSegment(sps, pps, srcW, srcH));
          ready = true;
          video.play().catch(() => {});
          const held = pre; pre = null;
          if (held) held.forEach(([k, t, d]) => b.frame(k, t, d));
        }, {once: true});
      },
      frame(kind, ts, data) {
        const key = kind === KIND.KEY;
        if (!ready) {   // MediaSource still opening: hold everything from the first keyframe on
          if (key) pre = [];
          if (pre && pre.length < 90) pre.push([kind, ts, data.slice()]); else if (!pre) askKeyframe();
          return;
        }
        if (!key && !gotKey) { askKeyframe(); return; }
        if (key) gotKey = true;
        if (queue.length > 30) { queue = []; gotKey = false; send('R'); return; }   // fell behind: wait for next keyframe
        const avcc = toAvcc(data);
        const hi = Math.floor(dts / 4294967296), lo = dts >>> 0;
        const trun = box('trun', [0, 0, 7, 1], u32(1), u32(0), u32(dur), u32(avcc.length), u32(key ? 0x02000000 : 0x01010000));
        const traf = box('traf', box('tfhd', [0, 2, 0, 0], u32(1)), box('tfdt', [1, 0, 0, 0], u32(hi), u32(lo)), trun);
        const moof = box('moof', box('mfhd', zeros(4), u32(seq++)), traf);
        new DataView(moof.buffer).setUint32(8 + 16 + 8 + 16 + 20 + 8 + 4 + 4, moof.length + 8);
        const mdat = box('mdat', avcc);
        dts += dur;
        queue.push(concat(moof, mdat));
        pump();
      },
      show() { canvas.style.display = 'none'; video.style.display = 'block'; },
    };
    function pump() {
      if (!sb || sb.updating || !ms || ms.readyState !== 'open') return;
      if (queue.length) { try { sb.appendBuffer(queue.shift()); } catch (e) { console.warn('append failed', e); } return; }

        if (sb.buffered.length) {
          const end = sb.buffered.end(sb.buffered.length - 1), start = sb.buffered.start(0);
          if (end - video.currentTime > 0.3) video.currentTime = end - 0.04;
          if (video.currentTime - start > 20) sb.remove(start, video.currentTime - 5);
        }
        if (video.paused) video.play().catch(() => {});
      } catch (e) {}
    }
    setInterval(pump, 250);
    return b;
  }

  async function chooseBackend() {
    let useWc = typeof VideoDecoder !== 'undefined' && !params.get('mse');
    if (useWc) {
      try {
        const r = await VideoDecoder.isConfigSupported({codec: 'avc1.42E01F', avc: {format: 'annexb'}});
        useWc = !!r.supported;
      } catch (e) { useWc = false; }
    }
    backend = useWc ? makeWebCodecs() : makeMse();
    backend.show();
    console.log('video backend:', backend.name);
    msg.textContent = `Видео: ${backend.name === 'WebCodecs' ? 'WebCodecs (быстрый режим)' : 'MSE (запасной режим, задержка чуть выше)'}. Нажмите, чтобы включить полноэкранный режим и звук`;
    if (backend.name !== 'WebCodecs' && !window.isSecureContext && typeof VideoDecoder === 'undefined') {

      msg.innerHTML = msg.textContent + `<br><br>Быстрый режим доступен по защищённому адресу: <b>https://${location.hostname}:8443</b> (браузер предупредит о сертификате, это нормально).`;
    }
  }

  // ---------------------------------------------------------------- audio
  function onAudio(channel, data) {
    if (!audioCtx || !cfg.audio) return;
    const media = channel === 6;
    const rate = media ? 48000 : 16000, chans = media ? 2 : 1;
    const samples = Math.floor(data.byteLength / 2 / chans);
    if (samples <= 0) return;
    const view = new DataView(data.buffer, data.byteOffset, samples * 2 * chans);
    const buf = audioCtx.createBuffer(chans, samples, rate);
    for (let c = 0; c < chans; c++) {
      const ch = buf.getChannelData(c);
      for (let i = 0; i < samples; i++) ch[i] = view.getInt16((i * chans + c) * 2, true) / 32768;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (audioCursor < now + 0.02) audioCursor = now + 0.06;
    if (audioCursor > now + 0.5) audioCursor = now + 0.06;
    src.start(audioCursor);
    audioCursor += buf.duration;
  }

  // ---------------------------------------------------------------- socket
  let counted = 0, lastT = performance.now(), shownFps = 0;
  function send(t) { if (ws && ws.readyState === 1) ws.send(t); }
  let lastAsk = 0;
  function askKeyframe() { const n = performance.now(); if (n - lastAsk > 1500) { lastAsk = n; send('R'); } }

  function toast(text, ms) {
    const t = $('toast'); t.textContent = text; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms || 4000);
  }
  // AUTO fit: Android Auto draws its UI into the top-left (uw x uh) part of the frame; show exactly that part, full window.
  function autoScale() {
    const r = touchEl.getBoundingClientRect();
    return Math.max(r.width / (cfg.uw || cfg.w), r.height / (cfg.uh || cfg.h));
  }
  function layout() {
    for (const el of [canvas, video]) {
      if (cfg.fitName === 'AUTO') {
        const s = autoScale();
        el.style.inset = 'auto'; el.style.left = (-(cfg.ox || 0) * s) + 'px'; el.style.top = (-(cfg.oy || 0) * s) + 'px';
        el.style.width = (cfg.w * s) + 'px'; el.style.height = (cfg.h * s) + 'px'; el.style.objectFit = 'fill';
      } else {
        el.style.inset = '0'; el.style.left = el.style.top = '';
        el.style.width = '100%'; el.style.height = '100%';
      }
    }
  }
  // Tell the phone the window's shape so it draws for it (one renegotiation if it changed); debounced against resize storms.
  let viewTimer = 0, lastView = '';
  function reportView() {
    clearTimeout(viewTimer);
    viewTimer = setTimeout(() => {
      const r = touchEl.getBoundingClientRect(), v = `V ${Math.round(r.width)} ${Math.round(r.height)}`;
      if (v !== lastView) { lastView = v; send(v); }
    }, 700);
  }
  addEventListener('resize', () => { layout(); reportView(); });
  function applyConfig(c) {
    if (c.deg !== undefined && c.deg !== cfg.deg && cfg.deg !== undefined) {
      toast(c.deg > cfg.deg ? `Связь не справляется — качество снижено: ${c.eff}` : `Связь наладилась — качество: ${c.eff}`, 5000);
    }
    cfg = Object.assign(cfg, c);
    canvas.style.objectFit = cfg.fit; video.style.objectFit = cfg.fit;
    layout();
    if (!backend || backend.name !== 'WebCodecs') { srcW = cfg.w; srcH = cfg.h; }
    renderPanel();
  }

  function connect() {
    const proto = REMOTE || location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${PHONE}/ws?k=${encodeURIComponent(token)}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      hud.textContent = 'подключено, жду видео…'; lastMsgAt = performance.now(); rtt = null;
      lastView = ''; reportView();
      send(`I ${backend ? backend.name : '?'} | ${screen.width}x${screen.height}@${devicePixelRatio} | ${navigator.userAgent}`);
      if (night) send('N 1');
    };

      lastMsgAt = performance.now();

      backend.frame(kind, ts, payload);

      hud.textContent = 'связь потеряна, переподключаюсь…';
      setTimeout(async () => { if ((await authOk(token)) === 'bad') { try { localStorage.removeItem('aa_pin'); } catch (e) {} token = ''; await gate(); } connect(); }, 1500);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // ---------------------------------------------------------------- touch (maps through the fit mode)
  function contentRect() {
    const r = touchEl.getBoundingClientRect();
    const W = srcW || 1280, H = srcH || 720;
    if (cfg.fitName === 'AUTO') { const s = autoScale(); return {x: r.left, y: r.top, w: (cfg.uw || W) * s, h: (cfg.uh || H) * s}; }
    if (cfg.fit === 'fill') return {x: r.left, y: r.top, w: r.width, h: r.height};
    const s = cfg.fit === 'cover' ? Math.max(r.width / W, r.height / H) : Math.min(r.width / W, r.height / H);

  });

  touchEl.addEventListener('pointercancel', e => release(e, true));
  touchEl.addEventListener('contextmenu', e => e.preventDefault());

  // ---------------------------------------------------------------- settings panel
  const GROUPS = [
    ['Разрешение', 'res', [['R480', '480p'], ['R720', '720p'], ['R1080', '1080p']], c => c.res],
    ['Ориентация', 'orient', [['L', 'Горизонтально'], ['P', 'Вертикально']], c => c.orient],
    ['Частота кадров', 'fps', [[30, '30'], [60, '60']], c => c.fps],
    ['Масштаб интерфейса', 'dpi', [[160, 'Мелко'], [213, 'Норм'], [260, 'Крупно'], [320, 'Очень']], c => c.dpi],
    ['Масштаб картинки', 'fit', [['AUTO', 'Без искажений'], ['FIT', 'Широкий, панель слева'], ['FILL', 'Заполнить'], ['STRETCH', 'Растянуть']], c => c.fitName],
    ['Звук', 'audio', [[0, 'На телефоне'], [1, 'В браузере']], c => c.audio ? 1 : 0],
    ['Авто-снижение качества при плохой связи', 'adapt', [[1, 'Вкл'], [0, 'Выкл']], c => c.adapt === false ? 0 : 1],
  ];
  function renderPanel() {
    if (panel.style.display !== 'block') return;
    panel.innerHTML = '<h3>Настройки потока</h3>';
    GROUPS.forEach(([title, key, opts, cur]) => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<label>${title}</label>`;
      const seg = document.createElement('div'); seg.className = 'seg';
      opts.forEach(([val, label]) => {
        const bt = document.createElement('button'); bt.textContent = label;
        if (String(cur(cfg)) === String(val)) bt.className = 'on';
        bt.onclick = () => send(`S ${key} ${val}`);
        seg.appendChild(bt);
      });
      row.appendChild(seg); panel.appendChild(row);
    });
    const note = document.createElement('div');
    note.style.cssText = 'font-size:11px;color:var(--dim);margin:2px 0 10px;line-height:1.35';
    note.textContent = (cfg.deg > 0 ? `Сейчас из-за слабой связи работает ${cfg.eff}. ` : '') + 'Смена разрешения, кадров, масштаба интерфейса и звука перезапускает сессию (1–2 секунды). 90 fps в Android Auto не поддерживается: только 30 и 60.';
    panel.appendChild(note);
  }
  $('gear').onclick = () => { dockEl.style.display = 'none'; panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; renderPanel(); };
  // tapping the video area closes the panel
  touchEl.addEventListener('pointerdown', () => {
    if (panel.style.display === 'block') panel.style.display = 'none';
    if (dockEl.style.display === 'flex') dockEl.style.display = 'none';
  }, true);

  // ---------------------------------------------------------------- quick buttons (☰)
  // Android key codes the phone's Android Auto understands (announced in the service discovery).
  const KEYS = {HOME: 3, BACK: 4, CALL: 5, MUSIC: 209, NAV: 65538, PREV: 88, PLAY: 85, NEXT: 87};
  let night = false, dockTimer = 0;
  try { night = localStorage.getItem('aa_night') === '1'; } catch (e) {}
  const dockEl = $('dock');
  function pressKey(code) { send(`K ${code} 1`); setTimeout(() => send(`K ${code} 0`), 70); }
  function fullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  }
  const DOCK = [
    ['⌂', 'Домой', () => pressKey(KEYS.HOME)],
    ['←', 'Назад', () => pressKey(KEYS.BACK)],
    ['🧭', 'Карта', () => pressKey(KEYS.NAV)],
    ['☎', 'Телефон', () => pressKey(KEYS.CALL)],
    ['♫', 'Музыка', () => pressKey(KEYS.MUSIC)],
    null,
    ['⏮', 'Пред.', () => pressKey(KEYS.PREV)],
    ['⏯', 'Пауза', () => pressKey(KEYS.PLAY)],
    ['⏭', 'След.', () => pressKey(KEYS.NEXT)],
    null,
    ['🌙', 'Ночь', b => { night = !night; send(`N ${night ? 1 : 0}`); try { localStorage.setItem('aa_night', night ? '1' : '0'); } catch (e) {} b.classList.toggle('on', night); }, () => night],
    ['⟳', 'Обновить', () => { send('R'); toast('Запросил свежую картинку', 1500); }],
    ['⛶', 'Экран', fullscreen],
  ];
  DOCK.forEach(d => {
    if (!d) { const sp = document.createElement('div'); sp.className = 'sep'; dockEl.appendChild(sp); return; }
    const b = document.createElement('button');
    b.innerHTML = `${d[0]}<small>${d[1]}</small>`;
    if (d[3] && d[3]()) b.classList.add('on');
    b.onclick = () => { d[2](b); armDock(); };
    dockEl.appendChild(b);
  });
  function armDock() { clearTimeout(dockTimer); dockTimer = setTimeout(() => { dockEl.style.display = 'none'; }, 7000); }
  $('dockbtn').onclick = () => {
    panel.style.display = 'none';
    const show = dockEl.style.display !== 'flex';
    dockEl.style.display = show ? 'flex' : 'none';
    if (show) armDock();
  };

  // ---------------------------------------------------------------- start
  $('go').onclick = () => {
    startEl.classList.add('hide');
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'interactive'}); audioCtx.resume(); } catch (e) {}
    try { document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  };

  setInterval(() => {
    const now = performance.now();
    shownFps = Math.round(counted * 1000 / (now - lastT)); counted = 0; lastT = now;
    if (ws && ws.readyState === 1) {
      // the phone sends a stats message every 2 s even when the picture is still; silence means a dead socket
      if (now - lastMsgAt > 7000) { console.warn('socket silent, reconnecting'); try { ws.close(); } catch (e) {} return; }
      send('P ' + Math.round(now));
      const mbit = (stats.kbps / 1000).toFixed(1);
      if (shownFps > 0) {
        const lag = rtt === null ? '' : ` · пинг ${rtt} мс`;
        const q = cfg.deg > 0 ? ` · ⬇ ${cfg.eff}` : '';
        hud.textContent = `${shownFps} fps · ${mbit} Мбит/с · ${backend ? backend.name : ''}${lag}${q}`;
        hud.style.color = rtt !== null && rtt > 250 ? '#ffb454' : '#fff';
      } else {
        hud.style.color = '#fff';
        const why = stats.note || (stats.aa && !/подключён/.test(stats.aa) ? stats.aa : '');
        hud.textContent = (why || 'жду видео… (экран не меняется — это нормально)') + (rtt === null ? '' : ` · пинг ${rtt} мс`);
      }
    }
  }, 1000);

  window.__dbg = () => ({backend: backend && backend.name, buf: video.buffered.length ? [video.buffered.start(0), video.buffered.end(video.buffered.length - 1)] : null,
    t: video.currentTime, rs: video.readyState, err: video.error && video.error.message});
  async function authOk(pin) {
    try { const r = await tfetch(HTTP + '/auth?k=' + encodeURIComponent(pin)); return r.status === 200 ? 'ok' : (r.status === 429 ? 'blocked' : 'bad'); }
    catch (e) { return 'net'; }
  }
  async function gate() {
    // Phone not reachable yet (hotspot or VPN still coming up): keep looking instead of asking for a PIN nobody can check.
    let o = null;
    for (let i = 0; !o; i++) {
      try { o = await (await tfetch(HTTP + '/open')).json(); }
      catch (e) { if (i === 0 || i % 5 === 0) msg.textContent = 'Ищу телефон… Включена ли точка доступа и запущен ли Rudich Auto?'; await sleep(1500); }
    }
    if (o.pin === false) return true;
    if (token) {
      const r = await authOk(token);
      if (r === 'ok') { try { localStorage.setItem('aa_pin', token); } catch (e) {} return true; }
      if (r === 'net') return true;   // phone not reachable yet; the socket will keep retrying
    }
    const box = $('pin'), input = $('pininput'), err = $('pinerr');
    box.style.display = 'flex'; input.value = ''; input.focus();
    return new Promise(res => {
      const submit = async () => {
        const r = await authOk(input.value.trim());
        if (r === 'ok') { token = input.value.trim(); try { localStorage.setItem('aa_pin', token); } catch (e) {} box.style.display = 'none'; res(true); }
        else { err.textContent = r === 'blocked' ? 'Слишком много попыток, подождите 30 секунд' : 'Неверный PIN'; input.select(); }
      };
      $('pinok').onclick = submit;
      input.onkeydown = e => { if (e.key === 'Enter') submit(); };
    });
  }
  window.__dbg2 = () => token;
  gate().then(() => chooseBackend()).then(connect);
})();
</script>
</body>
</html>
